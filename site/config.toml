# CamCraft documentation site (#688), built with Zola: `zola build` here
# writes public/ (gitignored). The release workflow builds it on the
# tagged tree and deploys it to GitHub Pages with --base-url set to the
# Pages URL, so base_url below is only the local default.
# Provenance: our own site; content written from this repo's code and docs.
base_url = "https://neotech.github.io/Camcraft"
title = "CamCraft"
description = "CamCraft: an open-source CAM system that turns 3D models into G-code for CNC mills and lathes."
default_language = "en"
compile_sass = false
build_search_index = true
generate_feeds = false

# Search (#1245): Zola writes search_index.en.js from the pages below; the
# header box loads it with the vendored elasticlunr (static/vendor/). Only
# the title, description, path and the start of each body are indexed.
[search]
index_format = "elasticlunr_javascript"
include_title = true
include_description = true
include_path = true
include_content = true
truncate_content_length = 2000

[markdown]
smart_punctuation = false

[markdown.highlighting]
theme = "github-light"

[extra]
repo = "https://github.com/NeoTech/Camcraft"
